#
# Android build lane. The authoring machine has no JDK/SDK/NDK, so this is the only
# place the app is proven to compile.
#
# Every risky step reports its own failure as a GitHub ::error annotation. That is
# deliberate: annotations are readable through the public API without credentials,
# while job logs are not, so a failure here is diagnosable without a human copying
# the log text out by hand.
name: ci-android

on:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The SDK is installed with plain shell rather than a third-party action:
      # android-actions/setup-android@v3 targets Node 20 and is now forced onto
      # Node 24, and every version is explicit here.
      - name: Install Android SDK
        run: |
          set -eo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          if ! curl -fsSL -o cmdtools.zip "$URL"; then
            echo "::error title=cmdline-tools download failed::curl could not fetch $URL"
            exit 1
          fi
          unzip -q -o cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # `yes` gets SIGPIPE when sdkmanager exits, and pipefail would turn that
          # into a failure of an otherwise successful licence step.
          yes | "$SM" --sdk_root="$SDK" --licenses > licenses.log 2>&1 || true
          if ! "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > sdk.log 2>&1; then
            echo "::error title=sdkmanager failed::$(tail -c 600 sdk.log | tr '\n' '|')"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "sdkmanager $(cat "$SDK/cmdline-tools/latest/source.properties" | grep Pkg.Revision)"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version | head -6
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # Compile first: Kotlin errors are the ones most likely to be mine, and this
      # step is what turns them into a readable annotation.
      - name: Compile Kotlin (errors reported as annotations)
        run: |
          set -o pipefail
          if gradle :app:compileDebugKotlin --no-daemon --stacktrace > kotlin.log 2>&1; then
            echo "Kotlin compiled"
          else
            echo "::error title=Kotlin compile failed::$(grep -m 4 -E '^e: ' kotlin.log | tr '\n' '|' | cut -c1-900)"
            grep -m 30 -E '^e: |^w: |What went wrong|Caused by' kotlin.log || true
            exit 1
          fi

      - name: Unit tests (errors reported as annotations)
        run: |
          set -o pipefail
          if gradle :app:testDebugUnitTest --no-daemon --stacktrace > test.log 2>&1; then
            echo "Unit tests passed"
          else
            echo "::error title=unit tests failed::$(grep -m 4 -E 'FAILED|expected:|AssertionError' test.log | tr '\n' '|' | cut -c1-900)"
            grep -m 30 -E 'FAILED|expected:|AssertionError|Caused by' test.log || true
            exit 1
          fi

      - name: Assemble debug APK (errors reported as annotations)
        run: |
          set -o pipefail
          if gradle :app:assembleDebug --no-daemon --stacktrace > assemble.log 2>&1; then
            echo "APK assembled"
          else
            echo "::error title=assemble failed::$(grep -m 4 -E '^e: |error:|What went wrong' assemble.log | tr '\n' '|' | cut -c1-900)"
            grep -m 30 -E '^e: |error:|What went wrong|Caused by' assemble.log || true
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn