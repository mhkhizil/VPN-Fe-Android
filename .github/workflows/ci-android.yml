#
# Android build lane. This exists because the development machine has no JDK, no
# Android SDK and no NDK: the only place an APK is actually proven to compile and
# the JVM tests actually run is here.
name: ci-android

on:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No gradle wrapper is committed (its jar is a binary), so install a pinned
      # distribution and put `gradle` on PATH.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The Android SDK is installed with plain shell rather than a third-party
      # action on purpose: android-actions/setup-android@v3 targets Node 20 and is now
      # forced onto Node 24, which is what failed this job. Fewer moving parts, and
      # the version of every component is visible right here.
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version | head -6
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # Compile Kotlin first and separately: it fails fastest and its errors are the
      # ones most likely to be mine, not the toolchain's.
      - name: Compile (Kotlin errors surface here first)
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Unit tests (contract parsing, no emulator needed)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn