#
# Android build lane: the authoring machine has no JDK/SDK/NDK, so this is the only
# place the app is proven to compile.
#
# Diagnostics design: job logs are not readable without credentials, but commit
# comments are. On failure this workflow publishes the interesting log lines as a
# commit comment, so a red build is diagnosable from outside.
name: ci-android

on:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  # write only to publish failure diagnostics as a commit comment
  contents: write

jobs:
  build:
    name: assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        run: |
          set -eo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          curl -fsSL -o cmdtools.zip "$URL"
          unzip -q -o cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > licenses.log 2>&1 || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > sdk.log 2>&1
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version | head -6
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace > kotlin.log 2>&1 || (cat kotlin.log; exit 1)

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace > test.log 2>&1 || (cat test.log; exit 1)

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace > assemble.log 2>&1 || (cat assemble.log; exit 1)

      # The whole point: make a red build readable from outside the UI.
      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          EXCERPT=$(cat kotlin.log test.log assemble.log sdk.log 2>/dev/null | grep -E "^e: |error:|FAILED|What went wrong|Caused by|Could not (resolve|find|GET)|Unresolved|Incompatible|requires|is not" | head -40 | cut -c1-400)
          if [ -z "$EXCERPT" ]; then EXCERPT="(no matching error lines found in any log)"; fi
          jq -n --arg b "$EXCERPT" --arg s "$SHA" '{body: ("Build diagnostics for " + $s + ":\n\n```\n" + $b + "\n```")}' > payload.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/$SHA/comments" -d @payload.json > /dev/null
          echo published

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: winter-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn